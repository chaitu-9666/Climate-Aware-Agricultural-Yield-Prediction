services:
  api:
    build: .
    image: agri-yield-pro:latest
    command: uvicorn backend.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - AGRI_MODEL_DIR=/app/models
      - AGRI_DATA_DIR=/app/data/raw
    volumes:
      - ./models:/app/models
      - ./data/raw:/app/data/raw

  dashboard:
    build: .
    image: agri-yield-pro:latest
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - AGRI_MODEL_DIR=/app/models
      - AGRI_DATA_DIR=/app/data/raw
    volumes:
      - ./models:/app/models
      - ./data/raw:/app/data/raw
    depends_on:
      - api
